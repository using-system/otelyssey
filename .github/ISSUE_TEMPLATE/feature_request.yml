name: Feature request
description: An improvement to the marketplace - a new host, a rule, a page, the pipeline
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The friction
      description: What real situation does the current behavior make painful? Concrete beats abstract.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would change, and - when there are options - the trade-offs you see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workaround today
      description: How you cope without it (helps calibrate priority).
