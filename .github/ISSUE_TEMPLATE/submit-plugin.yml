name: Plugin submission
description: Submit an OpenTelemetry agent plugin hosted in a public GitHub repository.
title: "[Plugin]: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Give the URL of your plugin's `plugin.json` on GitHub; the repository reads everything
        else from it and answers here.
  - type: input
    id: plugin-url
    attributes:
      label: plugin.json URL
      description: As GitHub shows it, on your default branch or a release tag.
      placeholder: https://github.com/owner/repo/blob/main/plugin.json
    validations:
      required: true
